<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- VibeMic 图标源文件:圆角方块底 + 白色麦克风。
       用 resvg 渲染成 1024 PNG 后跑 `npx tauri icon` 生成全套位图,见 desktop/README.md。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C6CFF"/>
      <stop offset="1" stop-color="#4F2DA8"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- 麦克风胶囊(白色实心) -->
  <rect x="392" y="204" width="240" height="400" rx="120" fill="#FFFFFF"/>
  <!-- 支架弧 + 立柱 + 底座(白色圆头描边) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="56" stroke-linecap="round">
    <path d="M304 452 v48 a208 208 0 0 0 416 0 v-48"/>
    <path d="M512 708 v112"/>
    <path d="M384 820 h256"/>
  </g>
</svg>
